<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set up camera and microphone · Cliprame</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="page.css">
</head>
<body>
    <main class="onboard">
        <div class="brand"><img src="icons/icon-32.png" alt="" width="26" height="26"> Cliprame Recorder</div>
        <div class="onboard-card">
            <div class="cam-circle" id="cam-circle">
                <video id="cam" muted playsinline autoplay></video>
                <svg class="icon" aria-hidden="true"><use href="icons.svg#camera"/></svg>
            </div>
            <h1 id="heading">Set up your camera and mic</h1>
            <p>Chrome asks once. After that, the recorder can add your voice and a camera bubble to any tab you record.</p>

            <div class="checks">
                <div class="check" id="check-camera">
                    <span class="check-icon"><svg class="icon" aria-hidden="true"><use href="icons.svg#camera"/></svg></span>
                    <span class="check-text"><b>Camera</b><small id="camera-state">Not allowed yet</small></span>
                </div>
                <div class="check" id="check-mic">
                    <span class="check-icon"><svg class="icon" aria-hidden="true"><use href="icons.svg#mic"/></svg></span>
                    <span class="check-text"><b>Microphone</b><small id="mic-state">Not allowed yet</small></span>
                    <span class="bars" id="bars" aria-hidden="true" hidden></span>
                </div>
            </div>

            <button type="button" class="btn-primary wide" id="allow">Allow camera and microphone</button>
            <p class="status-bad" id="error" role="alert" hidden></p>
            <div class="done" id="done" role="status" hidden>
                <b>You're all set.</b> Open any tab and click the Cliprame button<span id="shortcut-text"></span>. You can close this page.
            </div>
        </div>
    </main>
    <script src="permission.js"></script>
</body>
</html>
